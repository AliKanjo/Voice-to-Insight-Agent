<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice-to-Insight Agent</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --panel-2: #232734;
      --text: #f5f7fa;
      --muted: #9aa4b2;
      --accent: #6ea8fe;
      --green: #3ddc84;
      --red: #ff5c5c;
      --amber: #ffca3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 24px 32px;
      border-bottom: 1px solid #2a2e3a;
    }
    header h1 { margin: 0; font-size: 28px; }
    header p { margin: 4px 0 0; color: var(--muted); }
    .wrap {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 24px;
      padding: 24px 32px;
      max-width: 1400px;
    }
    @media (max-width: 960px) { .wrap { grid-template-columns: 1fr; } }

    .card {
      background: var(--panel);
      border: 1px solid #2a2e3a;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }
    h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 14px; }

    /* Record controls */
    .rec-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 14px 22px;
      font-weight: 600;
      color: #0f1117;
      background: var(--accent);
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #recordBtn { font-size: 20px; padding: 20px 30px; }
    #recordBtn.recording { background: var(--red); color: #fff; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,92,92,.5);} 50% { box-shadow: 0 0 0 14px rgba(255,92,92,0);} }
    .indicator { display: flex; align-items: center; gap: 8px; color: var(--muted); }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #444; }
    .dot.live { background: var(--red); }

    /* waveform bars */
    #meter { display: flex; align-items: flex-end; gap: 3px; height: 40px; }
    #meter span { width: 5px; background: var(--accent); border-radius: 3px; height: 4px; transition: height .06s; }

    textarea {
      width: 100%; min-height: 90px; margin-top: 10px;
      background: var(--panel-2); color: var(--text);
      border: 1px solid #333; border-radius: 10px; padding: 12px; font: inherit; resize: vertical;
    }
    .samples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .samples button { background: var(--panel-2); color: var(--text); padding: 8px 12px; font-size: 13px; font-weight: 500; }

    /* Error banner */
    #errorBanner {
      display: none; background: #3a1a1a; border: 1px solid var(--red);
      color: #ffd7d7; padding: 14px 18px; border-radius: 10px; margin: 0 32px 0;
      white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 14px;
    }

    /* Stage pipeline */
    .stage { border-left: 3px solid #333; padding: 4px 0 4px 16px; margin-bottom: 14px; }
    .stage.done { border-color: var(--green); }
    .stage.active { border-color: var(--amber); }
    .stage.err { border-color: var(--red); }
    .stage .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .stage .body { margin-top: 4px; font-size: 18px; word-break: break-word; }
    pre { background: var(--panel-2); border-radius: 10px; padding: 14px; overflow-x: auto; font-size: 15px; margin: 6px 0 0; }

    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 15px; }
    .badge.task { background: #16324f; color: var(--accent); }
    .badge.content { background: #3a2a12; color: var(--amber); }
    .badge.summary { background: #123a2a; color: var(--green); }
    .badge.error { background: #3a1a1a; color: var(--red); }
    .locale { color: var(--muted); font-size: 14px; }

    /* Task list */
    .task-item { background: var(--panel-2); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
    .task-item .t { font-size: 17px; font-weight: 600; }
    .task-item .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .pri { padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }
    .pri.high { background:#4f1616;color:#ff8f8f;} .pri.medium{background:#4f4016;color:#ffd97a;} .pri.low{background:#16324f;color:#8fc0ff;}
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>🎙️ Voice-to-Insight Agent</h1>
    <p>Record a voice note (Arabic, English, or both) → transcribe → classify → act.</p>
  </header>

  <div id="errorBanner"></div>

  <div class="wrap">
    <div>
      <div class="card">
        <h2>1 · Voice input</h2>
        <div class="rec-row">
          <button id="recordBtn">● Record</button>
          <div class="indicator"><span class="dot" id="recDot"></span><span id="recStatus">Idle</span></div>
          <div id="meter"></div>
        </div>

        <textarea id="textFallback" placeholder="…or paste Arabic / English text here and skip the mic (fallback path)."></textarea>
        <div class="samples" id="samples"></div>
        <div style="margin-top:10px">
          <button id="runTextBtn" style="background:var(--panel-2);color:var(--text)">Run text → understand</button>
        </div>
      </div>

      <div class="card" id="pipelineCard">
        <h2>Pipeline</h2>
        <div id="pipeline"><p class="empty">Record or run text to see the chain light up.</p></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>Running tasks</h2>
        <div id="tasks"><p class="empty">No tasks yet.</p></div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
