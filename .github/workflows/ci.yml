name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Catches dependency drift like faster-whisper's missing `requests`.
      - name: Check local Whisper imports
        run: python -c "import faster_whisper; print('faster-whisper', faster_whisper.__version__)"

      - name: Check frontend JavaScript syntax
        run: node --check static/app.js

      - name: Run tests
        run: python -m pytest -q

  # Build the image with Docker Build Cloud and push it to Docker Hub, only for
  # pushes to main and only after the tests pass. Skipped until the repository
  # variable DOCKER_USER (and secret DOCKER_PAT) are configured.
  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCKER_USER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "alikanjo/ali"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_USER }}/voice-to-insight-agent:latest
            ${{ vars.DOCKER_USER }}/voice-to-insight-agent:${{ github.sha }}
